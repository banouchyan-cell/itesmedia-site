# Ամեն ժամ YouTube-ից վերցնում է նախագծերի նոր թողարկումները,
# թարմացնում videos.js-ը և հրապարակում կայքը itesmedia.am-ում։
# Նույնը տեղի է ունենում ամեն անգամ, երբ կայքում ինչ-որ բան ես փոխում։
name: Update videos and publish

on:
  schedule:
    - cron: "17 * * * *"     # ամեն ժամ
  push:
    branches: [main]
  workflow_dispatch:          # ձեռքով գործարկելու կոճակ GitHub-ում

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest videos
        run: python tools/update_videos.py

      - name: Save videos.js if changed
        run: |
          if git diff --quiet videos.js; then echo "Նոր վիդեո չկա"; exit 0; fi
          git config user.name "itesmedia-bot"
          git config user.email "itesmedia-bot@users.noreply.github.com"
          git add videos.js
          git commit -m "Update videos"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # GitHub-ը երբեմն առաջին անգամ «artifact չի գտնում», ուստի կրկնում ենք
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
