<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITES MEDIA — Ի տես ամենքի</title>
<meta name="description" content="#itesmedia — բազմաբնույթ մեդիաբովանդակություն մարդկանց, կարևոր դեպքերի և իրադարձությունների մասին։">
<meta property="og:title" content="ITES MEDIA — Ի տես ամենքի">
<meta property="og:image" content="assets/logo.jpg">
<link rel="icon" href="assets/logo.jpg">
<link rel="preload" href="assets/ArmBebas.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"ArmBebas";src:url("assets/ArmBebas.ttf") format("truetype");font-display:swap}
:root{--ink:#0d0d0d;--muted:#6f7685;--line:#e4e8ef;--bg:#fff;--red:#d0142c;--blue:#022a66;--max:960px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Armenian",system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.bebas{font-family:"ArmBebas",Impact,sans-serif;font-weight:400;letter-spacing:.02em;line-height:1}

/* header */
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--blue) 0 50%,var(--red) 50% 100%)}
.brand span,.menu a,.label h2,.prow .t,.clist a{color:var(--blue)}
.brand span b{font-weight:400;color:var(--red)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:44px;height:44px;border-radius:4px}
.brand span{font-size:26px;padding-top:3px}
.menu{display:flex;gap:28px;list-style:none;margin:0;padding:0}
.menu a{text-decoration:none;font-size:22px;padding-top:3px;display:block;transition:color .15s}
.menu a:hover,.menu a.on{color:var(--red)}

/* ticker */
.ticker{display:flex;align-items:stretch;height:36px;background:var(--blue);color:#fff;overflow:hidden}
.ticker[hidden]{display:none}
.tlabel{flex:none;display:flex;align-items:center;padding:3px 14px 0;background:var(--red);font-size:18px;letter-spacing:.04em}
.tview{flex:1;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ttrack{display:flex;width:max-content;height:100%;align-items:center;animation:tick var(--tdur,60s) linear infinite}
.ticker:hover .ttrack{animation-play-state:paused}
.ttrack a{white-space:nowrap;text-decoration:none;font-size:14px;padding:0 4px;color:#fff}
.ttrack a:hover{text-decoration:underline}
.ttrack .sep{color:var(--red);padding:0 18px;font-size:10px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ttrack{animation:none}}
@media (max-width:760px){.tlabel{font-size:16px;padding:3px 10px 0}.ttrack a{font-size:13px}}

/* hero */
.hero{padding:120px 0 100px}
.hero h1{font-size:clamp(64px,13vw,150px);margin:0;color:var(--blue)}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{margin:28px 0 0;max-width:520px;color:var(--muted);font-size:17px}

/* side promo: slides in from the right */
.promo{position:fixed;right:16px;bottom:16px;z-index:40;width:300px;background:#fff;box-shadow:0 10px 30px rgba(2,42,102,.28);transform:translateX(calc(100% + 24px));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.promo.show{transform:none}
.promo[hidden]{display:none}
.promo a{display:block;text-decoration:none;color:#fff}
.promo img{display:block;width:100%;aspect-ratio:2/1}
.promo .go{display:flex;justify-content:space-between;align-items:center;background:var(--blue);padding:9px 12px 7px;font-size:19px;letter-spacing:.02em}
.promo .go span:last-child{color:#fff;background:var(--red);padding:2px 8px 0}
.promo a:hover .go{background:var(--red)}
.promo a:hover .go span:last-child{background:var(--blue)}
.promo .px{position:absolute;top:-12px;right:-12px;width:28px;height:28px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:18px;line-height:28px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.promo .px:hover{background:var(--red)}
@media (max-width:760px){.promo{width:220px;right:12px;bottom:12px}.promo .go{font-size:16px;padding:7px 10px 5px}}

/* sections */
section{padding:96px 0;border-bottom:1px solid var(--line)}
.label{display:flex;align-items:baseline;gap:14px;margin:0 0 40px}
.label h2{font-size:clamp(44px,7vw,64px);margin:0;padding-left:18px;border-left:6px solid var(--red)}
.label small{color:var(--muted);font-size:14px}

/* projects */
.ptoggle{width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;justify-content:space-between;align-items:center}
.ptoggle .ar{font-size:44px;color:var(--red);transition:transform .25s;line-height:1}
.ptoggle[aria-expanded="true"] .ar{transform:rotate(45deg)}
.ptoggle:hover h2{color:var(--red)}
#projects:not(.open) .ptoggle{margin-bottom:0}
.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.pitem{border-bottom:1px solid var(--line)}
.prow{width:100%;display:grid;grid-template-columns:56px 1fr 28px;align-items:center;gap:12px;padding:26px 0 22px;background:none;border:0;cursor:pointer;text-align:left;color:inherit;font:inherit}
.prow .n{font-size:22px;color:var(--muted)}
.prow .t{font-size:clamp(28px,4.4vw,42px);transition:color .15s}
.prow .d{display:block;font-family:"Noto Sans Armenian",sans-serif;font-size:14px;color:var(--muted);letter-spacing:0;line-height:1.5;margin-top:8px}
.prow .ar{font-size:28px;color:var(--muted);transition:transform .25s,color .15s;justify-self:end}
.prow:hover .t,.pitem.open .t{color:var(--red)}
.pitem.open .ar{transform:rotate(45deg);color:var(--red)}
.pbody{display:none;padding:0 0 32px 68px}
.pitem.open .pbody{display:block}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 16px}
.vthumb{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.vthumb .im{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--line)}
.vthumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.vthumb .im::after{content:"";position:absolute;inset:0;background:rgba(2,42,102,0);transition:background .2s}
.vthumb .pl{position:absolute;z-index:1;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--red);display:grid;place-items:center;opacity:0;transform:scale(.8);transition:.2s}
.vthumb .pl svg{width:16px;height:16px;margin-left:2px;fill:#fff}
.vthumb:hover img{transform:scale(1.04)}
.vthumb:hover .im::after{background:rgba(2,42,102,.25)}
.vthumb:hover .pl{opacity:1;transform:none}
.vthumb .vt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.45;margin-top:8px}
.vthumb .vd{font-size:12px;color:var(--muted);margin-top:2px}
.pbody>a{display:inline-block;margin-top:20px;font-size:14px;color:var(--blue);text-decoration:none}
.pbody>a:hover{color:var(--red)}
/* video modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,28,.88);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .box{position:relative;width:min(960px,100%);aspect-ratio:16/9;background:#000}
.modal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modal .x{position:absolute;top:-44px;right:0;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;line-height:1}

/* news */
.nlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.nitem{display:grid;grid-template-columns:140px 1fr;gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}
.nitem time{font-size:20px;color:var(--muted);padding-top:4px}
.nitem h3{margin:0 0 6px;font-size:19px;font-weight:500;line-height:1.4}
.nitem p{margin:0;color:#444}
.nitem .src{display:inline-block;margin-top:6px;font-size:13px;color:var(--muted);text-decoration:none}
.nitem .src:hover{color:var(--red)}
.more{margin-top:24px;background:none;border:1px solid var(--ink);padding:10px 20px;font:inherit;font-size:14px;cursor:pointer}
.more:hover{background:var(--ink);color:#fff}

/* about + contact */
.about{display:grid;grid-template-columns:1.3fr 1fr;gap:64px}
.about p.lead{font-size:22px;line-height:1.5;margin:0}
.ctitle{font-size:22px;color:var(--red);margin-bottom:10px}
.clist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.clist li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.clist li span{color:var(--muted);font-size:14px;padding-top:2px}
.clist a{text-decoration:none;font-size:22px;transition:color .15s}
.clist a:hover{color:var(--red)}

footer{padding:40px 0;background:var(--blue);color:#c9d3e6;font-size:14px}
.plist,.nlist,.clist{border-top-color:var(--blue)!important}
.more{border-color:var(--blue)!important;color:var(--blue)}
.more:hover{background:var(--blue)!important;color:#fff}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:760px){
  .wrap{padding:0 16px}
  .brand span{display:none}
  .menu{gap:16px}
  .menu a{font-size:19px}
  .hero{padding:72px 0 64px}
  section{padding:64px 0}
  .label{margin-bottom:28px}
  .prow{grid-template-columns:36px 1fr 24px;padding:20px 0 16px}
  .pbody{padding-left:0}
  .vgrid{grid-template-columns:repeat(2,1fr);gap:16px 12px}
  .vthumb .vt{font-size:13px}
  .nitem{grid-template-columns:1fr;gap:4px}
  .about{grid-template-columns:1fr;gap:40px}
  .about p.lead{font-size:19px}
}
@media (max-width:360px){ .menu{gap:12px} .menu a{font-size:17px} }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="#top"><img src="assets/logo.jpg" alt="ITES MEDIA"></a>
    <ul class="menu bebas">
      <li><a href="#news">Նորություններ</a></li>
      <li><a href="#projects">Նախագծեր</a></li>
      <li><a href="#about">Մեր մասին</a></li>
    </ul>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <h1 class="bebas" id="slogan"></h1>
      <p id="hero-text"></p>
    </div>
  </div>

  <div class="ticker" id="ticker" hidden>
    <span class="tlabel bebas">Լրահոս</span>
    <div class="tview"><div class="ttrack" id="ttrack"></div></div>
  </div>

  <section id="projects">
    <div class="wrap">
      <button class="label ptoggle" id="ptoggle" aria-expanded="false" aria-controls="plist">
        <h2 class="bebas">Նախագծեր</h2><span class="ar bebas">+</span>
      </button>
      <ul class="plist" id="plist" hidden></ul>
    </div>
  </section>

  <section id="news">
    <div class="wrap">
      <div class="label"><h2 class="bebas">Նորություններ</h2></div>
      <ul class="nlist" id="nlist"></ul>
      <button class="more" id="more" hidden>Ավելին</button>
    </div>
  </section>

  <section id="about">
    <div class="wrap">
      <div class="label"><h2 class="bebas">Մեր մասին</h2></div>
      <div class="about">
        <p class="lead" id="about-text"></p>
        <div><div class="ctitle bebas">Կապ</div><ul class="clist" id="clist"></ul></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap"><span>© <span id="year"></span> ITES MEDIA</span><span>itesmedia.am</span></div>
</footer>

<aside class="promo" id="promo" hidden><button class="px" aria-label="Փակել">×</button></aside>

<div class="modal" id="modal"><div class="box"><button class="x" aria-label="Փակել">×</button></div></div>

<script src="content.js"></script>
<script src="videos.js"></script>
<script>
(function(){
  const S = window.SITE, $ = id => document.getElementById(id);
  const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const months = ["հունվարի","փետրվարի","մարտի","ապրիլի","մայիսի","հունիսի","հուլիսի","օգոստոսի","սեպտեմբերի","հոկտեմբերի","նոյեմբերի","դեկտեմբերի"];
  const fmt = d => { if(!d) return ""; const [y,m,dd] = d.split("-").map(Number); return `${dd} ${months[m-1]} ${y}`; };

  // slogan: last word in red
  const w = S.slogan.trim().split(/\s+/), last = w.pop();
  $("slogan").innerHTML = `${esc(w.join(" "))} <em>${esc(last)}</em>`;
  $("hero-text").textContent = S.about;
  $("about-text").textContent = S.about;
  $("year").textContent = new Date().getFullYear();

  // projects (accordion with YouTube playlist)
  $("plist").innerHTML = S.projects.map((p,i) => `
    <li class="pitem">
      <button class="prow" aria-expanded="false">
        <span class="n bebas">${String(i+1).padStart(2,"0")}</span>
        <span class="t bebas">${esc(p.title)}${p.text ? `<span class="d">${esc(p.text)}</span>` : ""}</span>
        <span class="ar bebas">+</span>
      </button>
      <div class="pbody" data-id="${esc(p.id)}"></div>
    </li>`).join("");
  document.querySelectorAll(".pitem").forEach(li => {
    li.querySelector(".prow").onclick = () => {
      const open = !li.classList.contains("open");
      document.querySelectorAll(".pitem.open").forEach(o => { o.classList.remove("open"); o.querySelector(".prow").setAttribute("aria-expanded","false"); o.querySelector(".pbody").innerHTML = ""; });
      if (!open) return;
      li.classList.add("open"); li.querySelector(".prow").setAttribute("aria-expanded","true");
      const b = li.querySelector(".pbody"), pid = b.dataset.id;
      const vids = (window.VIDEOS && window.VIDEOS[pid]) || [];
      b.innerHTML = (vids.length ? `<div class="vgrid">${vids.map(v => `
          <button class="vthumb" data-v="${esc(v.id)}">
            <div class="im"><img src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg" alt="" loading="lazy"><span class="pl"><svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg></span></div>
            <div class="vt">${esc(v.title)}</div><div class="vd">${fmt(v.date)}</div>
          </button>`).join("")}</div>` : "")
        + `<a href="https://www.youtube.com/playlist?list=${encodeURIComponent(pid)}" target="_blank" rel="noopener">Բոլոր թողարկումները YouTube-ում ↗</a>`;
      b.querySelectorAll(".vthumb").forEach(t => t.onclick = () => openVideo(t.dataset.v));
    };
  });

  // side promo (content.js → promo): slides in after a few seconds; × hides it for this visit
  const P = S.promo;
  if (P && P.img && P.url) {
    let closed = false; try { closed = sessionStorage.getItem("promoClosed") === "1"; } catch (e) {}
    if (!closed) {
      const el = $("promo");
      el.insertAdjacentHTML("beforeend",
        `<a href="${esc(P.url)}" target="_blank" rel="noopener"><img src="${esc(P.img)}" alt="${esc(P.alt)}"><div class="go bebas"><span>${esc(P.label || "")}</span><span>→</span></div></a>`);
      el.hidden = false;
      setTimeout(() => el.classList.add("show"), (P.delay || 3) * 1000);
      el.querySelector(".px").onclick = () => {
        el.classList.remove("show"); setTimeout(() => el.hidden = true, 600);
        try { sessionStorage.setItem("promoClosed", "1"); } catch (e) {}
      };
    }
  }

  // ticker: latest news titles, duplicated once so the loop is seamless
  const tItems = S.news.slice(0, 8).filter(n => n.title);
  if (tItems.length) {
    const one = tItems.map(n => `<a href="#news">${esc(n.title)}</a><span class="sep">●</span>`).join("");
    $("ttrack").innerHTML = one + one;
    $("ticker").hidden = false;
    requestAnimationFrame(() => {   // constant speed (~60px/s) whatever the length
      $("ttrack").style.setProperty("--tdur", Math.max(20, $("ttrack").scrollWidth / 2 / 60) + "s");
    });
  }

  // whole Projects list opens/closes from its heading (and from the menu link)
  const setProjects = open => {
    $("projects").classList.toggle("open", open);
    $("ptoggle").setAttribute("aria-expanded", open);
    $("plist").hidden = !open;
  };
  $("ptoggle").onclick = () => setProjects($("plist").hidden);
  document.querySelector('.menu a[href="#projects"]').addEventListener("click", () => setProjects(true));

  // video modal
  const modal = $("modal"), mbox = modal.querySelector(".box");
  const closeVideo = () => { modal.classList.remove("open"); mbox.querySelector("iframe")?.remove(); };
  function openVideo(id){
    closeVideo();
    mbox.insertAdjacentHTML("beforeend", `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1" title="YouTube" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`);
    modal.classList.add("open");
  }
  modal.onclick = e => { if (e.target === modal || e.target.classList.contains("x")) closeVideo(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeVideo(); });

  // news (short text items, 6 at a time)
  let shown = 6;
  const renderNews = () => {
    $("nlist").innerHTML = S.news.slice(0, shown).map(n => `
      <li class="nitem"><time class="bebas" datetime="${esc(n.date)}">${fmt(n.date)}</time>
      <div><h3>${esc(n.title)}</h3>${n.text ? `<p>${esc(n.text)}</p>` : ""}${n.source ? `<a class="src" href="${esc(n.url||"#")}" target="_blank" rel="noopener">Աղբյուր՝ ${esc(n.source)} ↗</a>` : ""}</div></li>`).join("");
    $("more").hidden = S.news.length <= shown;
  };
  $("more").onclick = () => { shown += 6; renderNews(); };
  renderNews();

  // contact
  const rows = [];
  if (S.contact.email) rows.push(["Էլ. փոստ", `mailto:${S.contact.email}`, S.contact.email]);
  if (S.contact.phone) rows.push(["Հեռախոս", `tel:${S.contact.phone.replace(/\s/g,"")}`, S.contact.phone]);
  Object.entries(S.socials).forEach(([k,u]) => u && rows.push(["", u, k]));
  $("clist").innerHTML = rows.map(([lab,href,txt]) =>
    `<li><a class="bebas" href="${esc(href)}"${/^http/.test(href) ? ' target="_blank" rel="noopener"' : ""}>${esc(txt)}</a><span>${lab || "↗"}</span></li>`).join("");

  // highlight current section in menu
  const links = [...document.querySelectorAll(".menu a")];
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#"+e.target.id)); }), {rootMargin:"-40% 0px -55% 0px"});
  ["projects","news","about"].forEach(id => io.observe($(id)));
})();
</script>
</body>
</html>
